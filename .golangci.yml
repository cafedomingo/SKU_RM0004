version: "2"

linters:
  enable:
    - errcheck
    - goconst
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused

  exclusions:
    rules:
      # Repeated fixture strings in tests are not worth extracting into constants.
      - path: _test\.go
        linters:
          - goconst

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/cafedomingo/SKU_RM0004
